# HydroBreak – Netlify-Konfiguration (Frontend)

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = false

# SPA: Unbekannte Pfade auf index.html (Dateien aus dist/ werden weiterhin ausgeliefert)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Sicherheits-Header (optional)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
